services:
  - type: web
    name: hungph-blog-backend
    env: python
    region: singapore # hoặc oregon, frankfurt tùy sở thích
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000"
      - key: DATABASE_URL
        fromDatabase:
          name: hungph-blog-db
          property: connectionString

databases:
  - name: hungph-blog-db
    plan: free
    region: singapore
    databaseName: hungph_blog
    user: blog_admin
